<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Foragits</title>
    <style>
      body {
        background-color: #333;
        color: #eee;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      #game-container {
        position: relative;
      }
      #game-container canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
      #background-canvas {
        z-index: 1; /* Bottom layer */
      }
      /* The rot-js canvas will be programmatically set to z-index 2 */
      #particle-canvas {
        z-index: 3; /* Top layer for effects */
        pointer-events: none;
      }
      #game-ui {
        margin-bottom: 10px;
        font-size: 1.2em;
      }
      #flash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 0, 0, 0.3);
        z-index: 100;
        pointer-events: none;
        display: none;
      }
      #message-log {
        color: #ffc107; /* Amber color */
        height: 1.5em; /* Reserve space */
        font-size: 1.1em;
        text-align: center;
      }
      #help-button {
        position: fixed;
        top: 15px;
        right: 20px;
        font-size: 1.5em;
        font-family: monospace;
        cursor: pointer;
        z-index: 200;
        color: #eee;
        border: 2px solid #eee;
        border-radius: 50%;
        width: 1.5em;
        height: 1.5em;
        text-align: center;
        line-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>Foragits</h1>
    <div id="game-ui"></div>
    <div id="message-log"></div>
    <div id="help-button">?</div>
    <div id="flash-overlay"></div>
    <div id="game-container">
      <canvas id="background-canvas"></canvas>
      <canvas id="particle-canvas"></canvas>
    </div>
    <script src="./rot-2.2.1.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
